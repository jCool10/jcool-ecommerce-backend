        <text x="1205" y="78" font-size="13" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Payment</text>
      </g><g class="ak-node" data-node-id="stripe" data-label="Stripe" data-role="external" data-desc="external" tabindex="0">
        <rect x="1410" y="50" width="130" height="48" rx="6" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="1475" y="78" font-size="13" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Stripe</text>
      </g></svg>
