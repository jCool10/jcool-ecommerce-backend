        <text x="660" y="520" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Stripe</text>
        <text x="660" y="538" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">external</text>
      </g><g class="ak-node" data-node-id="media" data-label="Media" data-role="storage" data-desc="Upload lifecycle, presigned URLs to the S3-compatible bucket, reclaim sweep. Publishes MEDIA_FACADE." tabindex="0">
        <rect x="840" y="392" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="920" y="416" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Media</text>
        <text x="920" y="434" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">storage</text>
      </g></svg>
