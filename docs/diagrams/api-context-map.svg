<svg class="ak-diagram-svg" viewBox="36 56 988 531" width="988" height="531" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="api context map"><title>api context map</title><desc>Each solid arrow between contexts is a call into a port the target publishes, through an adapter the calling context owns; the others are a context&apos;s calls out of the process. The dashed arrow is no call: it is the payment.authorized event Payment appends to its outbox, which Order consumes to signal the checkout saga, so Payment never depends on Order. No context reads another&apos;s tables.</desc><defs><style>
      svg {
        --ak-bg: #ffffff; --ak-surface: #f8fafc; --ak-surface-border: #e2e8f0;
        --ak-text-primary: #0f172a; --ak-text-secondary: #475569; --ak-text-muted: #94a3b8;
        --ak-accent: #2563eb; --ak-node-bg: #ffffff; --ak-node-border: #cbd5e1;
        --ak-edge-stroke: #64748b; --ak-edge-active: #2563eb;
        --ak-font-sans: system-ui, -apple-system, sans-serif;
        font-family: var(--ak-font-sans);
      }

      svg { --ak-accent: #06b6d4; --ak-edge-stroke: #0ea5e9; --ak-edge-active: #38bdf8; }


    </style><marker id="ak-arrowhead-1e801c78" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--ak-edge-stroke)" />
    </marker>
  </defs><rect x="36" y="56" width="988" height="531" rx="12" fill="var(--ak-bg)" /><g class="ak-edge" data-from="order" data-to="user-service" data-edge-id="edge-order-user-service-0">
        <path d="M 220 424 C 270 424, 270 112, 320 112" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="270" y="262" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">address</text></g><g class="ak-edge" data-from="order" data-to="smtp" data-edge-id="edge-order-smtp-1">
        <path d="M 220 424 C 270 424, 270 216, 320 216" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="270" y="314" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">mail</text></g><g class="ak-edge" data-from="order" data-to="cart" data-edge-id="edge-order-cart-2">
        <path d="M 220 424 C 270 424, 270 320, 320 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="270" y="366" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">snapshot</text></g><g class="ak-edge" data-from="order" data-to="product" data-edge-id="edge-order-product-3">
        <path d="M 220 424 C 400 424, 400 424, 580 424" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="400" y="418" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">price · stock TCC</text></g><g class="ak-edge" data-from="order" data-to="payment" data-edge-id="edge-order-payment-4">
        <path d="M 220 424 C 270 424, 270 528, 320 528" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="270" y="470" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">open · capture · void</text></g><g class="ak-edge" data-from="cart" data-to="product" data-edge-id="edge-cart-product-5">
        <path d="M 480 320 C 530 320, 530 424, 580 424" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="530" y="366" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">live price</text></g><g class="ak-edge" data-from="payment" data-to="stripe" data-edge-id="edge-payment-stripe-6">
        <path d="M 480 528 C 530 528, 530 528, 580 528" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="530" y="522" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">sessions</text></g><g class="ak-edge" data-from="product" data-to="media" data-edge-id="edge-product-media-7">
        <path d="M 740 424 C 790 424, 790 424, 840 424" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="790" y="418" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">images</text></g><g class="ak-edge" data-from="payment" data-to="order" data-edge-id="edge-payment-order-8">
        <path d="M 320 544 C 140 544, 140 544, 140 456" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ak-arrowhead-1e801c78)" /><text x="230" y="560" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">payment.authorized (event)</text></g><g class="ak-node" data-node-id="order" data-label="Order" data-role="backend" data-desc="Order aggregate, state machine and the checkout saga that writes every status past DRAFT. Drives stock and payment through the TCC participants." tabindex="0">
