        <text x="660" y="434" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="stripe" data-label="Stripe" data-role="external" data-desc="Hosted manual-capture checkout sessions; HMAC-signed webhooks come back to Payment." tabindex="0">
