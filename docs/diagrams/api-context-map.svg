        <text x="140" y="416" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Order</text>
        <text x="140" y="434" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="user-service" data-label="user-service" data-role="auth" data-desc="Internal HTTP: the buyer&apos;s address for the order.paid mail." tabindex="0">
        <rect x="320" y="80" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="400" y="104" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">user-service</text>
        <text x="400" y="122" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">auth</text>
      </g><g class="ak-node" data-node-id="smtp" data-label="SMTP relay" data-role="external" data-desc="Order confirmation mail, attempted at most once when order.paid is consumed." tabindex="0">
        <rect x="320" y="184" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="400" y="208" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">SMTP relay</text>
        <text x="400" y="226" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">external</text>
      </g><g class="ak-node" data-node-id="cart" data-label="Cart" data-role="backend" data-desc="Per-user lines, quantities only. Publishes CART_SNAPSHOT." tabindex="0">
        <rect x="320" y="288" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="400" y="312" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Cart</text>
        <text x="400" y="330" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="payment" data-label="Payment" data-role="backend" data-desc="TCC participant over Stripe manual capture, fenced per order by a payment_orders header; webhook sink and reconcile sweep. Publishes PAYMENT_PARTICIPANT; never reads the order." tabindex="0">
        <rect x="320" y="496" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="400" y="520" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Payment</text>
        <text x="400" y="538" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="product" data-label="Product" data-role="backend" data-desc="Catalog and stock, two aggregate groups meeting only by variantId. Publishes PRODUCT_SKU_QUERY and INVENTORY_PARTICIPANT (Try, commit, release, fenced by reservation_orders)." tabindex="0">
        <rect x="580" y="392" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
