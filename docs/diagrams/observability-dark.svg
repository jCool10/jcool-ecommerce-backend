        <path d="M 480 216 C 530 216, 530 112, 580 112" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-9d5101f2)" /></g><g class="ak-edge" data-from="b-loki" data-to="b-loki-chunks" data-edge-id="edge-b-loki-b-loki-chunks-6">
