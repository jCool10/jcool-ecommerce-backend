        <text x="140" y="312" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">id-service ×3</text>
        <text x="140" y="330" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="a-prometheus" data-label="Prometheus" data-role="database" data-desc="Scrapes the api&apos;s /metrics with METRICS_TOKEN, and Loki&apos;s own metrics. Alert rules ship with promtool tests." tabindex="0">
