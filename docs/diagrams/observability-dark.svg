        <path d="M 220 320 C 270 320, 270 216, 320 216" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-9d5101f2)" /></g><g class="ak-edge" data-from="a-prometheus" data-to="a-grafana" data-edge-id="edge-a-prometheus-a-grafana-4">
