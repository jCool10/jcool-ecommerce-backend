        <text x="660" y="122" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">frontend</text>
      </g><g class="ak-node" data-node-id="b-loki-chunks" data-label="loki-chunks bucket" data-role="storage" data-desc="Chunks and index, 30-day retention." tabindex="0">
