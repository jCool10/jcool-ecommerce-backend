<svg class="ak-diagram-svg" viewBox="36 56 728 320" width="728" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Observability on Railway"><title>Observability on Railway</title><desc>Every Node service pushes its pino lines to Loki as well as stdout; Prometheus scrapes the api&apos;s token-guarded /metrics; Grafana, the only public piece, queries both behind a login. No trace backend is deployed: a traceId joins log lines across services.</desc><defs><style>
      svg {
        --ak-bg: #ffffff; --ak-surface: #f8fafc; --ak-surface-border: #e2e8f0;
        --ak-text-primary: #0f172a; --ak-text-secondary: #475569; --ak-text-muted: #94a3b8;
        --ak-accent: #2563eb; --ak-node-bg: #ffffff; --ak-node-border: #cbd5e1;
        --ak-edge-stroke: #64748b; --ak-edge-active: #2563eb;
        --ak-font-sans: system-ui, -apple-system, sans-serif;
        font-family: var(--ak-font-sans);
      }
      svg { --ak-bg: #090d16; --ak-text-primary: #f8fafc; --ak-text-secondary: #94a3b8; --ak-node-bg: #0f172a; --ak-node-border: #334155; --ak-edge-stroke: #475569; --ak-edge-active: #38bdf8; }
      svg { --ak-accent: #06b6d4; --ak-edge-stroke: #0ea5e9; --ak-edge-active: #38bdf8; }
      
      
    svg { --ak-surface: #111827; --ak-surface-border: #334155; }</style><marker id="ak-arrowhead-9d5101f2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--ak-edge-stroke)" />
    </marker>
  </defs><rect x="36" y="56" width="728" height="320" rx="12" fill="var(--ak-bg)" /><g class="ak-edge" data-from="a-api" data-to="a-prometheus" data-edge-id="edge-a-api-a-prometheus-0">
        <path d="M 220 112 C 270 112, 270 112, 320 112" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-9d5101f2)" /><text x="270" y="106" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">/metrics</text></g><g class="ak-edge" data-from="a-api" data-to="b-loki" data-edge-id="edge-a-api-b-loki-1">
        <path d="M 220 112 C 270 112, 270 216, 320 216" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-9d5101f2)" /></g><g class="ak-edge" data-from="b-user-service" data-to="b-loki" data-edge-id="edge-b-user-service-b-loki-2">
