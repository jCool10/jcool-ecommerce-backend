      </g><g class="ak-node" data-node-id="b-loki" data-label="Loki" data-role="database" data-desc="Push target for every Node service; WAL on a volume." tabindex="0">
        <rect x="320" y="184" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="400" y="208" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Loki</text>
        <text x="400" y="226" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">database</text>
      </g><g class="ak-node" data-node-id="a-grafana" data-label="Grafana · login" data-role="frontend" data-desc="The only public part of the stack. Links a traceId to its log lines across services." tabindex="0">
