<svg class="ak-diagram-svg" viewBox="24 36 1182 396" width="1182" height="396" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Order lifecycle"><title>Order lifecycle</title><desc>POST /orders moves DRAFT to RESERVING in tx A; the checkout saga alone writes every later edge, under the order row lock with a status guard. tx B lands PENDING with order.placed once the stock Try holds, or REJECTED (hidden from buyers) when it is refused or times out. A verified payment.authorized gives CONFIRMING; the saga commits the stock, then captures (the pivot) for PAID, else FAILED. The deadline gives EXPIRED, a cancel CANCELLED. Once stock is held, PAID commits it; any other ending releases it.</desc><defs><style>
      svg {
        --ak-bg: #ffffff; --ak-surface: #f8fafc; --ak-surface-border: #e2e8f0;
        --ak-text-primary: #0f172a; --ak-text-secondary: #475569; --ak-text-muted: #94a3b8;
        --ak-accent: #2563eb; --ak-node-bg: #ffffff; --ak-node-border: #cbd5e1;
        --ak-edge-stroke: #64748b; --ak-edge-active: #2563eb;
        --ak-font-sans: system-ui, -apple-system, sans-serif;
        font-family: var(--ak-font-sans);
      }

      svg { --ak-accent: #06b6d4; --ak-edge-stroke: #0ea5e9; --ak-edge-active: #38bdf8; }


    </style><marker id="ak-arrowhead-3bb12da5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--ak-edge-stroke)" />
    </marker>
  </defs><rect x="24" y="36" width="1182" height="396" rx="12" fill="var(--ak-bg)" /><g class="ak-stage" data-stage-id="checkout">
        <rect x="48" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="135" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">POST /orders</text>
      </g><g class="ak-stage" data-stage-id="try">
        <rect x="288" y="60" width="174" height="252" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="375" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">tx A · stock Try</text>
      </g><g class="ak-stage" data-stage-id="placed">
        <rect x="528" y="60" width="174" height="348" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="615" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">tx B</text>
      </g><g class="ak-stage" data-stage-id="window">
        <rect x="768" y="60" width="174" height="348" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="855" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">payment window</text>
      </g><g class="ak-stage" data-stage-id="pivot">
        <rect x="1008" y="60" width="174" height="348" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="1095" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">commit · capture</text>
      </g><g class="ak-edge" data-from="draft" data-to="reserving" data-edge-id="edge-draft-reserving-0">
        <path d="M 210 128 C 255 128, 255 224, 300 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="255" y="170" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">checkout</text></g><g class="ak-edge" data-from="draft" data-to="cancelled" data-edge-id="edge-draft-cancelled-1">
        <path d="M 210 128 C 495 128, 495 128, 780 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="495" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">discard</text></g><g class="ak-edge" data-from="reserving" data-to="pending" data-edge-id="edge-reserving-pending-2">
        <path d="M 450 224 C 495 224, 495 224, 540 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="495" y="218" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">stock held</text></g><g class="ak-edge" data-from="reserving" data-to="rejected" data-edge-id="edge-reserving-rejected-3">
        <path d="M 450 224 C 495 224, 495 320, 540 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="495" y="266" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">Try refused / timed out</text></g><g class="ak-edge" data-from="pending" data-to="confirming" data-edge-id="edge-pending-confirming-4">
        <path d="M 690 224 C 735 224, 735 224, 780 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="735" y="218" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">authorized</text></g><g class="ak-edge" data-from="pending" data-to="expired" data-edge-id="edge-pending-expired-5">
        <path d="M 690 224 C 735 224, 735 320, 780 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="735" y="266" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">deadline</text></g><g class="ak-edge" data-from="pending" data-to="cancelled" data-edge-id="edge-pending-cancelled-6">
        <path d="M 690 224 C 735 224, 735 128, 780 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="735" y="170" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">cancel</text></g><g class="ak-edge" data-from="confirming" data-to="paid" data-edge-id="edge-confirming-paid-7">
        <path d="M 930 224 C 975 224, 975 224, 1020 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="975" y="218" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">captured</text></g><g class="ak-edge" data-from="confirming" data-to="failed" data-edge-id="edge-confirming-failed-8">
        <path d="M 930 224 C 975 224, 975 320, 1020 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-3bb12da5)" /><text x="975" y="266" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">commit or capture failed</text></g><g class="ak-node" data-node-id="draft" data-label="DRAFT" data-role="source" data-desc="Built from the cart snapshot; discarded, or written RESERVING by POST /orders in tx A." tabindex="0">
        <rect x="60" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="135" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">DRAFT</text>
        <text x="135" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">source</text>
      </g><g class="ak-node" data-node-id="reserving" data-label="RESERVING" data-role="transform" data-desc="Written in tx A with the price-snapshot lines; the saga&apos;s stock Try decides it." tabindex="0">
        <rect x="300" y="196" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="375" y="220" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">RESERVING</text>
        <text x="375" y="238" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">transform</text>
      </g><g class="ak-node" data-node-id="pending" data-label="PENDING" data-role="store" data-desc="Stock held and order.placed appended in tx B; at most three per buyer." tabindex="0">
        <rect x="540" y="196" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="220" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">PENDING</text>
        <text x="615" y="238" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">store</text>
      </g><g class="ak-node" data-node-id="rejected" data-label="REJECTED" data-role="sink" data-desc="The stock Try was refused or timed out; hidden from the buyer and swept after RETENTION_REJECTED_ORDER_DAYS." tabindex="0">
        <rect x="540" y="292" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="316" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">REJECTED</text>
        <text x="615" y="334" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="cancelled" data-label="CANCELLED" data-role="sink" data-desc="A discarded draft, or a buyer or admin cancel while PENDING; stock released, session closed or hold voided." tabindex="0">
        <rect x="780" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="855" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">CANCELLED</text>
        <text x="855" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="confirming" data-label="CONFIRMING" data-role="transform" data-desc="A verified payment.authorized; the saga commits the stock, then captures the payment." tabindex="0">
        <rect x="780" y="196" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="855" y="220" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">CONFIRMING</text>
        <text x="855" y="238" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">transform</text>
      </g><g class="ak-node" data-node-id="expired" data-label="EXPIRED" data-role="sink" data-desc="No authorization by the payment deadline; stock released, session closed or hold voided." tabindex="0">
        <rect x="780" y="292" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="855" y="316" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">EXPIRED</text>
        <text x="855" y="334" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="paid" data-label="PAID" data-role="sink" data-desc="Stock committed, then the payment captured (the pivot); order.paid appended." tabindex="0">
        <rect x="1020" y="196" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="1095" y="220" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">PAID</text>
        <text x="1095" y="238" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="failed" data-label="FAILED" data-role="sink" data-desc="The stock commit or the capture failed; stock released or restocked, payment voided." tabindex="0">
        <rect x="1020" y="292" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="1095" y="316" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">FAILED</text>
        <text x="1095" y="334" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g></svg>
