<svg class="ak-diagram-svg" viewBox="24 36 702 492" width="702" height="492" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Order lifecycle"><title>Order lifecycle</title><desc>POST /orders goes DRAFT to PENDING inside one transaction that also holds the stock. Every settlement runs through FinalizeOrderUseCase under a row lock; the four settled states are terminal, which turns an at-least-once webhook into an exactly-once effect. PAID commits the stock hold, every other outcome releases it.</desc><defs><style>
      svg {
        --ak-bg: #ffffff; --ak-surface: #f8fafc; --ak-surface-border: #e2e8f0;
        --ak-text-primary: #0f172a; --ak-text-secondary: #475569; --ak-text-muted: #94a3b8;
        --ak-accent: #2563eb; --ak-node-bg: #ffffff; --ak-node-border: #cbd5e1;
        --ak-edge-stroke: #64748b; --ak-edge-active: #2563eb;
        --ak-font-sans: system-ui, -apple-system, sans-serif;
        font-family: var(--ak-font-sans);
      }
      
      svg { --ak-accent: #06b6d4; --ak-edge-stroke: #0ea5e9; --ak-edge-active: #38bdf8; }
      
      
    </style><marker id="ak-arrowhead-99abcffa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--ak-edge-stroke)" />
    </marker>
  </defs><rect x="24" y="36" width="702" height="492" rx="12" fill="var(--ak-bg)" /><g class="ak-stage" data-stage-id="placed">
        <rect x="48" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="135" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">checkout tx</text>
      </g><g class="ak-stage" data-stage-id="held">
        <rect x="288" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="375" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">stock held</text>
      </g><g class="ak-stage" data-stage-id="settled">
        <rect x="528" y="60" width="174" height="444" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="615" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">terminal</text>
      </g><g class="ak-edge" data-from="draft" data-to="pending" data-edge-id="edge-draft-pending-0">
        <path d="M 210 128 C 255 128, 255 128, 300 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-99abcffa)" /><text x="255" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">place</text></g><g class="ak-edge" data-from="draft" data-to="d-cancelled" data-edge-id="edge-draft-d-cancelled-1">
        <path d="M 210 128 C 375 128, 375 416, 540 416" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-99abcffa)" /><text x="375" y="266" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">discard</text></g><g class="ak-edge" data-from="pending" data-to="a-paid" data-edge-id="edge-pending-a-paid-2">
        <path d="M 450 128 C 495 128, 495 128, 540 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-99abcffa)" /><text x="495" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">paid</text></g><g class="ak-edge" data-from="pending" data-to="b-failed" data-edge-id="edge-pending-b-failed-3">
        <path d="M 450 128 C 495 128, 495 224, 540 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-99abcffa)" /><text x="495" y="170" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">failed</text></g><g class="ak-edge" data-from="pending" data-to="c-expired" data-edge-id="edge-pending-c-expired-4">
        <path d="M 450 128 C 495 128, 495 320, 540 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-99abcffa)" /><text x="495" y="218" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">lapsed</text></g><g class="ak-edge" data-from="pending" data-to="d-cancelled" data-edge-id="edge-pending-d-cancelled-5">
        <path d="M 450 128 C 495 128, 495 416, 540 416" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-99abcffa)" /><text x="495" y="266" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">cancel</text></g><g class="ak-node" data-node-id="draft" data-label="DRAFT" data-role="source" data-desc="Built and placed inside the checkout transaction." tabindex="0">
        <rect x="60" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="135" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">DRAFT</text>
        <text x="135" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">source</text>
      </g><g class="ak-node" data-node-id="pending" data-label="PENDING" data-role="store" data-desc="Stock held; at most three per buyer." tabindex="0">
        <rect x="300" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="375" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">PENDING</text>
        <text x="375" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">store</text>
      </g><g class="ak-node" data-node-id="a-paid" data-label="PAID" data-role="sink" data-desc="Webhook, payment.succeeded event or reconcile probe; the stock hold is committed." tabindex="0">
        <rect x="540" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">PAID</text>
        <text x="615" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="b-failed" data-label="FAILED" data-role="sink" data-desc="Payment failed; stock released." tabindex="0">
        <rect x="540" y="196" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="220" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">FAILED</text>
        <text x="615" y="238" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="c-expired" data-label="EXPIRED" data-role="sink" data-desc="The hold lapsed unpaid (reservation sweep or reconcile); stock released." tabindex="0">
        <rect x="540" y="292" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="316" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">EXPIRED</text>
        <text x="615" y="334" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g><g class="ak-node" data-node-id="d-cancelled" data-label="CANCELLED" data-role="sink" data-desc="Buyer or admin cancel, or a discarded draft; stock released." tabindex="0">
        <rect x="540" y="388" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="412" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">CANCELLED</text>
        <text x="615" y="430" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">sink</text>
      </g></svg>
