        <path d="M 690 128 C 735 128, 735 224, 780 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-5559a13e)" /><text x="735" y="170" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">deliver</text></g><g class="ak-edge" data-from="q-order" data-to="worker" data-edge-id="edge-q-order-worker-7">
