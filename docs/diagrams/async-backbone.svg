<svg class="ak-diagram-svg" viewBox="24 36 1422 300" width="1422" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Outbox to inbox"><title>Outbox to inbox</title><desc>An event is a row committed with the change it describes. The relay ships unpublished rows to BullMQ; a consumer claims the message in the inbox and applies its effect in that same transaction, so at-least-once delivery becomes an exactly-once effect. A failed delivery is parked in consumer_retries and retried by a leased poller; once its ladder is spent the row turns dead, and replaying it asks the inbox first.</desc><defs><style>
      svg {
        --ak-bg: #ffffff; --ak-surface: #f8fafc; --ak-surface-border: #e2e8f0;
        --ak-text-primary: #0f172a; --ak-text-secondary: #475569; --ak-text-muted: #94a3b8;
        --ak-accent: #2563eb; --ak-node-bg: #ffffff; --ak-node-border: #cbd5e1;
        --ak-edge-stroke: #64748b; --ak-edge-active: #2563eb;
        --ak-font-sans: system-ui, -apple-system, sans-serif;
        font-family: var(--ak-font-sans);
      }
      
      svg { --ak-accent: #06b6d4; --ak-edge-stroke: #0ea5e9; --ak-edge-active: #38bdf8; }
      
      
    </style><marker id="ak-arrowhead-11eaf4b0" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--ak-edge-stroke)" />
    </marker>
  </defs><rect x="24" y="36" width="1422" height="300" rx="12" fill="var(--ak-bg)" /><g class="ak-stage" data-stage-id="write">
        <rect x="48" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="135" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">write tx</text>
      </g><g class="ak-stage" data-stage-id="relay">
        <rect x="288" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="375" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">relay</text>
      </g><g class="ak-stage" data-stage-id="queue">
        <rect x="528" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="615" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">BullMQ</text>
      </g><g class="ak-stage" data-stage-id="consume">
        <rect x="768" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="855" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">consume</text>
      </g><g class="ak-stage" data-stage-id="effect">
        <rect x="1008" y="60" width="174" height="252" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="1095" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">effect · retry</text>
      </g><g class="ak-stage" data-stage-id="recover">
        <rect x="1248" y="60" width="174" height="200" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="1335" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">recover</text>
      </g><g class="ak-edge" data-from="a-change" data-to="a-relay" data-edge-id="edge-a-change-a-relay-0">
        <path d="M 210 128 C 255 128, 255 128, 300 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-11eaf4b0)" /><text x="255" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">commit</text></g><g class="ak-edge" data-from="a-relay" data-to="a-domain-events" data-edge-id="edge-a-relay-a-domain-events-1">
        <path d="M 450 128 C 495 128, 495 128, 540 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-11eaf4b0)" /><text x="495" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">publish</text></g><g class="ak-edge" data-from="a-domain-events" data-to="a-worker" data-edge-id="edge-a-domain-events-a-worker-2">
        <path d="M 690 128 C 735 128, 735 128, 780 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-11eaf4b0)" /><text x="735" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">deliver</text></g><g class="ak-edge" data-from="a-worker" data-to="b-retries" data-edge-id="edge-a-worker-b-retries-3">
        <path d="M 930 128 C 975 128, 975 224, 1020 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-11eaf4b0)" /><text x="975" y="170" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">park</text></g><g class="ak-edge" data-from="a-worker" data-to="a-effect" data-edge-id="edge-a-worker-a-effect-4">
        <path d="M 930 128 C 975 128, 975 128, 1020 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-11eaf4b0)" /><text x="975" y="122" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">claim + apply</text></g><g class="ak-edge" data-from="b-retries" data-to="b-replay" data-edge-id="edge-b-retries-b-replay-5">
        <path d="M 1170 224 C 1215 224, 1215 128, 1260 128" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-11eaf4b0)" /><text x="1215" y="170" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">dead</text></g><g class="ak-node" data-node-id="a-change" data-label="change + outbox row" data-role="source" data-desc="Order, Payment or catalog write and its event, one transaction. The writer captures the W3C traceparent." tabindex="0">
        <rect x="60" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="135" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">change + outbox row</text>
        <text x="135" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">source</text>
      </g><g class="ak-node" data-node-id="a-relay" data-label="relay · SKIP LOCKED" data-role="transform" data-desc="Polls published_at IS NULL with FOR UPDATE SKIP LOCKED, publishes, marks the row published in one transaction. Safe on every replica." tabindex="0">
        <rect x="300" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="375" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">relay · SKIP LOCKED</text>
        <text x="375" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">transform</text>
      </g><g class="ak-node" data-node-id="a-domain-events" data-label="domain-events" data-role="store" data-desc="Delivers each job once; BullMQ retries only a delivery whose retry row could not be written." tabindex="0">
        <rect x="540" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="615" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">domain-events</text>
        <text x="615" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">store</text>
      </g><g class="ak-node" data-node-id="a-worker" data-label="worker · inbox claim" data-role="consumer" data-desc="Claims (consumer, message_id) in inbox; a redelivery loses the claim and does nothing." tabindex="0">
        <rect x="780" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="855" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">worker · inbox claim</text>
        <text x="855" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">consumer</text>
      </g><g class="ak-node" data-node-id="a-effect" data-label="effect, same tx" data-role="store" data-desc="Settle, index, close a Stripe session, send mail at most once. A handler that throws takes its claim down with it." tabindex="0">
        <rect x="1020" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="1095" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">effect, same tx</text>
        <text x="1095" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">store</text>
      </g><g class="ak-node" data-node-id="b-retries" data-label="consumer_retries" data-role="store" data-desc="A leased poller retries a parked delivery: 8 attempts by default, a capped 15-attempt ladder for order.paid, order.expired, order.cancelled and catalog.*. Spent or permanent, the row turns dead." tabindex="0">
        <rect x="1020" y="196" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="1095" y="220" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">consumer_retries</text>
        <text x="1095" y="238" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">store</text>
      </g><g class="ak-node" data-node-id="b-replay" data-label="queue:replay-dlq" data-role="governance" data-desc="Dry run by default; checks the inbox before reviving a dead row, so a landed effect is skipped." tabindex="0">
        <rect x="1260" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="1335" y="124" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">queue:replay-dlq</text>
        <text x="1335" y="142" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">governance</text>
      </g></svg>
