        <path d="M 930 224 C 975 224, 975 224, 1020 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-5559a13e)" /><text x="975" y="218" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">claim + apply</text></g><g class="ak-edge" data-from="dlq-order" data-to="replay-order" data-edge-id="edge-dlq-order-replay-order-11">
        <path d="M 930 320 C 975 320, 975 320, 1020 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-5559a13e)" /><text x="975" y="314" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">inspect</text></g><g class="ak-node" data-node-id="a-change" data-label="api write + outbox" data-role="source" data-desc="Order or catalog write and its event, one transaction. The writer refuses an event type with no route and captures the W3C traceparent." tabindex="0">
        <rect x="60" y="100" width="150" height="56" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
