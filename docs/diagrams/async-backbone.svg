        <path d="M 690 224 C 735 224, 735 320, 780 320" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-5559a13e)" /><text x="735" y="266" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">exhausted</text></g><g class="ak-edge" data-from="dlq-api" data-to="replay-api" data-edge-id="edge-dlq-api-replay-api-9">
