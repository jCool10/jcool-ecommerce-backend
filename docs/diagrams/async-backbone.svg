<svg class="ak-diagram-svg" viewBox="24 36 1182 396" width="1182" height="396" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Outbox to inbox"><title>Outbox to inbox</title><desc>An event is a row committed with the change it describes, in the api&apos;s outbox or the payment-service&apos;s. Each relay adds unpublished rows to the BullMQ queue its route table names, order-events or api-events; the api&apos;s worker for that queue claims the message in the inbox and applies its effect in that same transaction, so at-least-once delivery becomes an exactly-once effect. Retries exhausted, a job lands in its queue&apos;s dead-letter queue, whose replay asks the inbox first.</desc><defs><style>
      svg {
        --ak-bg: #ffffff; --ak-surface: #f8fafc; --ak-surface-border: #e2e8f0;
        --ak-text-primary: #0f172a; --ak-text-secondary: #475569; --ak-text-muted: #94a3b8;
        --ak-accent: #2563eb; --ak-node-bg: #ffffff; --ak-node-border: #cbd5e1;
        --ak-edge-stroke: #64748b; --ak-edge-active: #2563eb;
        --ak-font-sans: system-ui, -apple-system, sans-serif;
        font-family: var(--ak-font-sans);
      }
      
      svg { --ak-accent: #06b6d4; --ak-edge-stroke: #0ea5e9; --ak-edge-active: #38bdf8; }
      
      
    </style><marker id="ak-arrowhead-5559a13e" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--ak-edge-stroke)" />
    </marker>
