        <path d="M 210 224 C 255 224, 255 224, 300 224" fill="none" stroke="var(--ak-edge-stroke)" stroke-width="2" marker-end="url(#ak-arrowhead-5559a13e)" /><text x="255" y="218" font-size="10" font-weight="500" fill="var(--ak-text-secondary)" text-anchor="middle" font-family="var(--ak-font-sans)" style="stroke:none;stroke-width:0;">commit</text></g><g class="ak-edge" data-from="a-relay" data-to="q-api" data-edge-id="edge-a-relay-q-api-2">
