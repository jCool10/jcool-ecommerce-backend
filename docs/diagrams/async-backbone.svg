        <text x="855" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">consume</text>
      </g><g class="ak-stage" data-stage-id="effect">
        <rect x="1008" y="60" width="174" height="348" rx="8" fill="var(--ak-surface)" stroke="var(--ak-surface-border)" stroke-width="1" stroke-dasharray="4 2" />
        <text x="1095" y="80" font-size="11" font-weight="600" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">effect</text>
