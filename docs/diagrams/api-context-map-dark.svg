        <text x="660" y="330" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">auth</text>
      </g><g class="ak-node" data-node-id="product" data-label="Product" data-role="backend" data-desc="Catalog and stock, two aggregate groups meeting only by variantId. Publishes PRODUCT_SKU_QUERY and PRODUCT_STOCK_RESERVATION." tabindex="0">
        <rect x="840" y="80" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="920" y="104" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Product</text>
        <text x="920" y="122" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="media" data-label="Media" data-role="storage" data-desc="Upload lifecycle, presigned URLs to the S3-compatible bucket, reclaim sweep. Publishes MEDIA_FACADE." tabindex="0">
        <rect x="1100" y="80" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
