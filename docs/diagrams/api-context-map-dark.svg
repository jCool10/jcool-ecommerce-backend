      </g><g class="ak-node" data-node-id="b-order" data-label="Order" data-role="backend" data-desc="Order aggregate, state machine, checkout and settlement. Publishes ORDER_PAYMENT_VIEW and the order-finalization port." tabindex="0">
        <rect x="320" y="184" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="400" y="208" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Order</text>
        <text x="400" y="226" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="a-cart" data-label="Cart" data-role="backend" data-desc="Per-user lines, quantities only. Publishes CART_SNAPSHOT." tabindex="0">
        <rect x="580" y="80" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="660" y="104" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">Cart</text>
        <text x="660" y="122" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">backend</text>
      </g><g class="ak-node" data-node-id="b-smtp" data-label="SMTP relay" data-role="external" data-desc="Order confirmation mail, attempted at most once when order.paid is consumed." tabindex="0">
        <rect x="580" y="184" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
        <text x="660" y="208" font-size="12" font-weight="600" fill="var(--ak-text-primary)" text-anchor="middle" font-family="var(--ak-font-sans)">SMTP relay</text>
        <text x="660" y="226" font-size="10" fill="var(--ak-text-muted)" text-anchor="middle" font-family="var(--ak-font-sans)">external</text>
      </g><g class="ak-node" data-node-id="c-user-service" data-label="user-service" data-role="auth" data-desc="Internal HTTP: the buyer&apos;s address for the order.paid mail." tabindex="0">
        <rect x="580" y="288" width="160" height="64" rx="8" fill="var(--ak-node-bg)" stroke="var(--ak-node-border)" stroke-width="1.5" />
