name: Ephemeral stack

# The whole compose stack from this PR's source, on arm64 like both deploy targets: migrate, seed,
# smoke, check the internal tokens, tear down. A PR that only touches deploy/ or Markdown still gets a
# green run: a required check that never starts leaves the PR pending forever.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ephemeral-${{ github.ref }}
  cancel-in-progress: true

# Untrusted code, no secrets. Pulling the build cache needs no token once jcool-build-cache is public
# (RUNBOOK.md, Published images); while it is private every image builds cold, slower but still green.
permissions:
  contents: read

jobs:
  stack:
    name: stack
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Diffs from the fork point, so commits that landed on main since then are not this PR's.
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" || true)
          if [ -n "$base" ] && scripts/is-deploy-or-docs-only.sh "$base" "$HEAD_SHA"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only deploy/ or Markdown changed: nothing to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.changes.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Raise vm.max_map_count for Elasticsearch
        if: steps.changes.outputs.skip != 'true'
        run: sudo sysctl -w vm.max_map_count=262144
      - if: steps.changes.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the stack images
        id: images
        if: steps.changes.outputs.skip != 'true'
        run: |
          docker compose version
          docker buildx bake -f docker-bake.hcl --load stack
          docker buildx bake -f docker-bake.hcl --print stack |
            jq -r '.target | to_entries[] | "\(.key)=\(.value.tags[0])"' > "$RUNNER_TEMP/images.env"
          df -h /
      - if: steps.changes.outputs.skip != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Start the stack
        if: steps.changes.outputs.skip != 'true'
        run: scripts/ephemeral-stack.sh "$RUNNER_TEMP/images.env" up
      - name: Seed the catalog and stock
        if: steps.changes.outputs.skip != 'true'
        run: scripts/ephemeral-stack.sh "$RUNNER_TEMP/images.env" seed
      - name: Smoke
        if: steps.changes.outputs.skip != 'true'
        run: scripts/ephemeral-stack.sh "$RUNNER_TEMP/images.env" smoke
      - name: Collect logs
        if: (failure() || cancelled()) && steps.images.outcome == 'success'
        run: scripts/ephemeral-stack.sh "$RUNNER_TEMP/images.env" logs "$RUNNER_TEMP/compose-logs"
      - if: (failure() || cancelled()) && steps.images.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: ${{ runner.temp }}/compose-logs
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      # The runner is thrown away anyway; a hiccup here must not turn a green run red.
      - name: Tear down
        if: always() && steps.images.outcome == 'success'
        continue-on-error: true
        run: scripts/ephemeral-stack.sh "$RUNNER_TEMP/images.env" down
