name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs on the same ref so a rapid push sequence doesn't queue
# stale jobs (a new push cancels the previous run for that branch/PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checkout. It needs no write scopes and no
# secrets — the test DB is an ephemeral Testcontainers instance, not a shared one.
permissions:
  contents: read

jobs:
  lint:
    name: Lint · Typecheck · Arch · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json `packageManager`
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # satisfies devDep engines (testcontainers/dependency-cruiser need node >=22)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ordered fastest-failing first: lint → typecheck → boundary check → build.
      - run: pnpm turbo run lint:check # eslint, no --fix (CI must report, not mutate)
      - run: pnpm turbo run typecheck # tsc --noEmit (SWC build emits without checking types)
      - run: pnpm turbo run arch:check # dependency-cruiser: layer/context boundaries
      - run: pnpm railway:check-flip-vars # the switches an operator flips by hand survive an IaC apply
      # Runtime dependencies only: a devDependency CVE cannot be reached by the deployed process,
      # and letting one turn the build red teaches everyone to ignore the gate. `high` rather than
      # `moderate` for the same reason — a floor that fires constantly is a floor nobody reads.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm turbo run build
      # Pinned to the deployed Prometheus so a rule that parses here cannot fail to load there.
      - name: Install promtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin prometheus-2.55.1.linux-amd64/promtool
      - run: pnpm alerts:check # alert rules parse
      - run: pnpm alerts:test # and fire (and clear) on the timelines they claim to

  test:
    name: Test (unit · coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage, not a bare `test`: same unit run, plus the unit floors declared in vitest.config.mts
      # (domain/application in the apps). The merged unit+e2e floors run in the e2e jobs.
      - run: pnpm turbo run test:cov # unit (Vitest) — fast, hermetic, no Docker; fails under the coverage floor

  # Argo CD syncs deploy/ from main, so a render that fails or references a missing Secret key must not land.
  manifests:
    name: Deploy manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned with the sha256 their releases publish; yq (mikefarah v4) ships on the runner image.
      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz"
          echo "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61  /tmp/kustomize.tar.gz" | sha256sum -c -
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kustomize version
          kubeconform -v
          yq --version
      - run: deploy/scripts/validate-manifests.sh

  # A job, not a workflow-level `paths` filter: CD chains off this workflow, so a red gateway run must
  # live here to block a deploy, and `paths` cannot scope a single job.
  gateway-changes:
    name: Detect gateway changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Pushes to main always run it: diffing against the previous push would skip a gateway change whose
        # own run went red or was cancelled, and CD would then ship it. On a PR an unknown base counts as changed.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! git diff --quiet "$BASE" HEAD -- apps/gateway .github/workflows/ci.yml .dockerignore \
              package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The api-behind-gateway spec needs the api image and a dual-stack network, so it runs in the nightly tier.
  gateway:
    name: Gateway · image and fixture specs
    needs: gateway-changes
    if: needs.gateway-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails fast, with Caddy's own message, on a Caddyfile that does not validate.
      - run: docker build -f apps/gateway/Dockerfile -t jcool-gateway:system-test .
      # pnpm, not turbo: the gateway has no workspace dependencies for `^build` to build.
      - run: pnpm --filter @jcool/gateway run test:system:fixtures
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # Read from the workspace rather than listed by hand, so a new service's suite cannot be left out of CI.
  e2e-suites:
    name: Discover e2e suites
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: node scripts/list-e2e-packages.mjs

  # One runner per suite: every suite boots its own containers and E2E_WORKERS forks, and Turbo running
  # them side by side on one 4-vCPU runner starved the wall-clock budgets the specs assert on.
  e2e:
    name: E2E · ${{ matrix.package }}
    needs: e2e-suites
    runs-on: ubuntu-latest # GitHub-hosted runner ships a Docker daemon → Testcontainers works
    strategy:
      fail-fast: false # one suite failing must not cancel the others and hide their results
      matrix:
        package: ${{ fromJSON(needs.e2e-suites.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's strict env mode drops unlisted vars: a new one here also goes in turbo.json `passThroughEnv`.
      # Unit and e2e under coverage, merged, against the infrastructure/interface floors in vitest.config.mts.
      - run: pnpm turbo run test:e2e:cov --filter="$PACKAGE" # Testcontainers spins real Postgres/Redis + programmatic migrate
        env:
          PACKAGE: ${{ matrix.package }}
          # Job is ephemeral (fresh runner, torn down after), so skip Ryuk's reaper
          # container. Trades auto-cleanup (unneeded here) for reliability on runners
          # that restrict spawning the reaper.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          # Spec files run in parallel, one Postgres database and one Redis logical db per worker.
          # ubuntu-latest is 4 vCPU, and the boot cost the parallelism hides is CPU-bound, so more
          # workers than cores buys contention rather than wall clock.
          E2E_WORKERS: '4'
      - id: artifact
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "dir=$(pnpm --filter "$PACKAGE" exec pwd)" >> "$GITHUB_OUTPUT"
          echo "name=coverage-$(echo "$PACKAGE" | tr -d '@' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      # The merged report of main and of a PR are the two sides of a test deletion's proof (scripts/coverage-diff.mjs).
      # Also kept when a floor fails, which is when it is wanted; a run that failed before the merge has none.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.dir }}/coverage/merged/coverage-final.json
          if-no-files-found: warn
          retention-days: 14
