name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs on the same ref so a rapid push sequence doesn't queue
# stale jobs (a new push cancels the previous run for that branch/PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checkout. It needs no write scopes and no
# secrets — the test DB is an ephemeral Testcontainers instance, not a shared one.
permissions:
  contents: read

jobs:
  lint:
    name: Lint · Typecheck · Arch · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11 (matches committed lockfile); satisfies devDep engines (testcontainers/dependency-cruiser need node >=22)
          cache: npm
      - run: npm ci
      # Ordered fastest-failing first: lint → typecheck → boundary check → build.
      - run: npm run lint:check # eslint, no --fix (CI must report, not mutate)
      - run: npm run typecheck # tsc --noEmit (SWC build emits without checking types)
      - run: npm run arch:check # dependency-cruiser: layer/context boundaries
      # Runtime dependencies only: a devDependency CVE cannot be reached by the deployed process,
      # and letting one turn the build red teaches everyone to ignore the gate. `high` rather than
      # `moderate` for the same reason — a floor that fires constantly is a floor nobody reads.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      # Pinned to the deployed Prometheus so a rule that parses here cannot fail to load there.
      - name: Install promtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin prometheus-2.55.1.linux-amd64/promtool
      - run: npm run alerts:check # alert rules parse
      - run: npm run alerts:test # and fire (and clear) on the timelines they claim to

  # The e2e harness migrates both journals programmatically; this proves the two RELEASE commands do
  # too, each against its own empty database and neither able to reach the other's. A journal that
  # only ever runs inside the harness is a journal nobody has deployed.
  migrate:
    name: Migrations · both journals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: commerce_core
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      postgres-user:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: user_service
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/commerce_core
      USER_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/user_service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate:prod
      - run: npm run db:migrate:prod:user
      # Deploys re-run these on every release, so a second pass has to be a no-op rather than an error.
      - name: Re-run both — migrations are idempotent
        run: npm run db:migrate:prod && npm run db:migrate:prod:user

  test:
    name: Test (unit + integration · Testcontainers)
    runs-on: ubuntu-latest # GitHub-hosted runner ships a Docker daemon → Testcontainers works
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Coverage, not a bare `npm test`: same unit run, plus the floor on domain/application
      # declared in vitest.config.mts. Running both would just run the suite twice.
      - run: npm run test:cov # unit (Vitest) — fast, hermetic, no Docker; fails under the coverage floor
      - run: npm run test:e2e # integration — Testcontainers spins real Postgres/Redis + programmatic migrate
        env:
          # Job is ephemeral (fresh runner, torn down after), so skip Ryuk's reaper
          # container. Trades auto-cleanup (unneeded here) for reliability on runners
          # that restrict spawning the reaper.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
