name: CD

# Deploy is chained off CI rather than off `push` so that a direct push to main — which no branch
# protection rule can gate — still cannot reach Railway with red code. Railway's own autodeploy must
# stay OFF for the api (the one service with a repo source), or every push deploys it twice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Never cancel a deploy in flight: a half-applied rollout is worse than a queued one.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Railway
    # `workflow_run` hands this job the repository's secrets, so the trigger is narrowed to a push
    # that landed on main in this repo. A pull_request-triggered CI run reports the fork's branch
    # and is excluded here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    # RAILWAY_TOKEN is scoped to the steps that call Railway, so install scripts never see it.
    env:
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
    steps:
      - name: Check deploy configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          missing=()
          [ -n "$RAILWAY_TOKEN" ] || missing+=("secrets.RAILWAY_TOKEN")
          [ -n "$RAILWAY_SERVICE" ] || missing+=("vars.RAILWAY_SERVICE")
          [ -n "$APP_PUBLIC_URL" ] || missing+=("vars.APP_PUBLIC_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::not configured: ${missing[*]}"
            exit 1
          fi

      # workflow_run checks out the default branch by default; pin the commit CI actually verified.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Pinned: an unattended deploy should not pick up CLI behaviour changes on its own.
      - run: npm install -g @railway/cli@5.49.6

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the Railway SDK needs node >=22
          cache: pnpm
      # Root only: .railway/railway.ts imports the Railway SDK; the app itself is built by Railway.
      - run: pnpm install --frozen-lockfile --filter .

      # Without --confirm-destructive, a plan that would delete a resource or variable is refused, so
      # a variable missing from .railway/railway.ts stops the deploy instead of being wiped.
      - name: Apply Railway config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config apply --yes

      # Exit 2 means something is still pending: the apply did not land (token scope, staged
      # changes), and `railway up` would deploy on the old settings.
      - name: Verify Railway config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config plan --detailed-exit-code

      # One at a time, each live before the next starts; a failure stops the rest. The gateway goes
      # last because its healthcheck is the api's: an api release that fixes a broken api must not
      # wait behind it.
      - name: Deploy id-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci --service id-service --environment "$RAILWAY_ENVIRONMENT"
          scripts/railway-wait-for-rollout.sh id-service

      - name: Deploy api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"
          scripts/railway-wait-for-rollout.sh "$RAILWAY_SERVICE"

      - name: Deploy gateway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci --service gateway --environment "$RAILWAY_ENVIRONMENT"
          scripts/railway-wait-for-rollout.sh gateway

      # Railway already gated the traffic switch on /health/ready from inside its network. This hits
      # the same probe from outside, so it covers what that gate cannot see: domain, TLS, and edge
      # routing. A failure here means the new version is live but unreachable — roll back by hand
      # (Deployments tab), because redeploying the same commit would reproduce it.
      - name: Smoke the public URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 \
            "${APP_PUBLIC_URL%/}/health/ready"

      # Dark, so it goes last: nothing public waits on it.
      - name: Deploy user-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci --service user-service --environment "$RAILWAY_ENVIRONMENT"
          scripts/railway-wait-for-rollout.sh user-service
