# Deterministic host ports (5433/5434/6380) avoid clashes with any host-installed Postgres/Redis and
# prevent port auto-increment / ghost processes.
#
# Two apps, one image, two databases. Redis is shared on purpose: the auth epoch and the denylist are
# the only state the two services have in common, and both are prefixed keys.
#
# Copy `.env.example` → `.env` and `.env.user.example` → `.env.user` first: the app services read
# them via `env_file`, so a missing file fails `up` fast (clearer than a later env-validation crash
# inside the container).
#
# To trace/scrape either app under `--profile observability`, set OTEL_ENABLED=true in its env file
# and the SAME METRICS_TOKEN in both — Prometheus scrapes the two jobs with one credentials file
# (infra/prometheus/secrets/metrics-token), which must match it too.

name: jcool-ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: jcool-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # user-service's own database. Separate instance, not a second schema: the point of the split is
  # that one app cannot join across the boundary even by accident.
  postgres-user:
    image: postgres:16-alpine
    container_name: jcool-postgres-user
    restart: unless-stopped
    ports:
      - "${POSTGRES_USER_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER_DB:-jcool_user}
    volumes:
      - pguserdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USER_DB:-jcool_user}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  redis:
    image: redis:7-alpine
    container_name: jcool-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # The search index is derived from Postgres and rebuildable from it, so this volume is a cache,
  # not a system of record.
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: jcool-meilisearch
    restart: unless-stopped
    ports:
      - "${SEARCH_HOST_PORT:-7700}:7700"
    environment:
      # Blank runs the engine keyless, which only MEILI_ENV=development allows.
      MEILI_MASTER_KEY: ${SEARCH_MASTER_KEY:-}
      MEILI_ENV: development
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # curl ships in this image (unlike the node-only app image below).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # Accepts every message and delivers none. The log sink the app falls back to records only the
  # envelope, so this web inbox is how a developer reads a verification or reset link. Nothing is
  # persisted — a restart empties it.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: jcool-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_HOST_PORT:-1025}:1025"
      - "${MAIL_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # Stands in for Cloudflare R2: same S3 API and same adapter, so a local upload exercises the code
  # that runs in production rather than a disk-backed lookalike.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jcool-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${STORAGE_HOST_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # One-shot: MinIO starts with no buckets, and the app never creates one — a process that can make
  # a bucket can make the wrong bucket and never notice. Exits as soon as the bucket is there.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: jcool-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY_ID} $${STORAGE_SECRET_ACCESS_KEY} &&
             mc mb --ignore-existing local/$${STORAGE_BUCKET}"
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    networks:
      - jcool-net

  # One-shot migrators. Kept out of the app containers so a bad migration stops the rollout instead
  # of crashlooping a version that was serving fine — the same reason db:migrate:prod is a release
  # command in production.
  commerce-core-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcool-commerce-core-migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['npm', 'run', 'db:migrate:prod']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jcool-net

  # The lease's own Postgres, one phase before id-service exists. Starting it here is what makes
  # Phase 6 a process change instead of a data migration under a fleet holding live leases.
  postgres-id:
    image: postgres:16-alpine
    container_name: jcool-postgres-id
    restart: unless-stopped
    ports:
      - "${POSTGRES_ID_HOST_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ID_DB:-jcool_leases}
    volumes:
      - pgiddata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_ID_DB:-jcool_leases}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  leases-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcool-leases-migrate
    env_file:
      - .env.user
    environment:
      NODE_ENV: production
      IDENTITY_LEASE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-id:5432/${POSTGRES_ID_DB:-jcool_leases}?schema=public
    command: ['npm', 'run', 'db:migrate:prod:leases']
    depends_on:
      postgres-id:
        condition: service_healthy
    networks:
      - jcool-net

  user-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcool-user-migrate
    env_file:
      - .env.user
    environment:
      NODE_ENV: production
      USER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-user:5432/${POSTGRES_USER_DB:-jcool_user}?schema=public
    command: ['npm', 'run', 'db:migrate:prod:user']
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - jcool-net

  commerce-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcool-commerce-core
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # .env carries the app's own secrets/config; the values below then override the host-oriented
    # ones it also holds (DATABASE_URL/REDIS_URL point at localhost there).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network the app reaches services by NAME, not the host-mapped ports.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SEARCH_URL: http://meilisearch:7700
      SMTP_URL: smtp://mailpit:1025
      STORAGE_ENDPOINT: http://minio:9000
      # Traces export to the Collector service (only up under `--profile observability`). Harmless
      # when OTEL_ENABLED is false or the Collector is down — OTLP export is fire-and-forget.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: ['node', '--import', './dist/apps/commerce-core/src/instrumentation.js', 'dist/apps/commerce-core/src/main.js']
    # meilisearch is deliberately not listed: search is an optional read path the app must boot
    # and serve without.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      commerce-core-migrate:
        condition: service_completed_successfully
      # The bucket must exist before the first upload is confirmed, and this container is the only
      # thing that creates it.
      minio-init:
        condition: service_completed_successfully
    # Probes with node (present in the image) because alpine has no curl/wget.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - jcool-net

  # Same image, second entry point. No meilisearch, no minio, no mailpit dependency beyond SMTP:
  # user-service issues tokens and sends verification/reset mail, and nothing else.
  user:
    build:
      context: .
      dockerfile: Dockerfile
    # No container_name and a host port RANGE, not a single port: both would make the second
    # container of `docker compose up --scale user=2` fail to start, and two replicas holding
    # distinct leased node ids is the property this phase exists to demonstrate.
    restart: unless-stopped
    ports:
      - "${USER_PORT_RANGE:-3002-3003}:3001"
    env_file:
      - .env.user
    environment:
      NODE_ENV: production
      PORT: 3001
      USER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-user:5432/${POSTGRES_USER_DB:-jcool_user}?schema=public
      # Its own database, never USER_DATABASE_URL. Pointing this at the app's would undo the split
      # a phase before it is even used.
      IDENTITY_LEASE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-id:5432/${POSTGRES_ID_DB:-jcool_leases}?schema=public
      IDENTITY_LEASE_SERVICE: user
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: ['node', '--import', './dist/apps/user/src/instrumentation.js', 'dist/apps/user/src/main.js']
    depends_on:
      postgres-user:
        condition: service_healthy
      postgres-id:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
      leases-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - jcool-net

  # Receives OTLP from the app, redacts PII, forwards to Jaeger. Distroless (no shell) → no
  # healthcheck; started, not waited on.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: jcool-otel-collector
    profiles: [observability]
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - jcool-net

  # All-in-one: ingests OTLP natively, so the Collector exports to it with no extra bridge.
  jaeger:
    image: jaegertracing/jaeger:2.1.0
    container_name: jcool-jaeger
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    networks:
      - jcool-net

  # Scrapes both apps' guarded /metrics with a bearer token read from the mounted secret file.
  # depends_on is service_started, NOT healthy — Prometheus must be up to observe an app failing,
  # not blocked by it.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: jcool-prometheus
    profiles: [observability]
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/prometheus/secrets:/etc/prometheus/secrets:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      commerce-core:
        condition: service_started
      user:
        condition: service_started
    networks:
      - jcool-net

  # UI is mapped to host 3001 to avoid clashing with the app on 3000.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: jcool-grafana
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - jcool-net

volumes:
  pgdata:
  pguserdata:
  pgiddata:
  redisdata:
  meilidata:
  miniodata:
  promdata:
  grafanadata:

networks:
  jcool-net:
    driver: bridge
