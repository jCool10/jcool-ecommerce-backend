# Local development infrastructure for the JCool E-commerce backend.
#
# Deterministic host ports (5433/6380) avoid clashes with any host-installed
# Postgres/Redis and prevent port auto-increment / ghost processes
# (see .claude/rules/process-management.md and plan phase-02).
#
# All credentials/ports come from `.env` (gitignored) — no secrets are hardcoded here.
# PREREQUISITE: copy `.env.example` → `.env` first. The `app` service reads it via `env_file`, so a
# missing `.env` fails `up` fast (clearer than a later env-validation crash inside the container).
#   Core (dev default):     docker compose up -d                            # postgres + redis + meilisearch + mailpit + app
#   Infra only:             docker compose up -d postgres redis meilisearch mailpit
#   + observability stack:  docker compose --profile observability up -d    # + collector/jaeger/prometheus/grafana
#   Reset everything:       docker compose down -v
#
# The 4 observability services sit behind the `observability` profile so the default `up` stays
# light. To trace/scrape the app container, set OTEL_ENABLED=true + METRICS_TOKEN in .env first
# (the app loads .env via env_file), and provision infra/prometheus/secrets/metrics-token to match.

name: jcool-ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: jcool-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  redis:
    image: redis:7-alpine
    container_name: jcool-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # Search engine holding the catalog search index. The index is derived from Postgres and
  # rebuildable from it, so this volume is a cache, not a system of record.
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: jcool-meilisearch
    restart: unless-stopped
    ports:
      - "${SEARCH_HOST_PORT:-7700}:7700"
    environment:
      # Blank runs the engine keyless, which only MEILI_ENV=development allows.
      MEILI_MASTER_KEY: ${SEARCH_MASTER_KEY:-}
      MEILI_ENV: development
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # curl ships in this image (unlike the node-only app image below).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # Dev mail server: accepts every message and delivers none, with a web inbox on 8025. The log
  # sink the app falls back to records only the envelope, so this is how a developer reads a
  # verification or reset link. Nothing is persisted — a restart empties the inbox.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: jcool-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_HOST_PORT:-1025}:1025"
      - "${MAIL_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jcool-net

  # Convenience: run the whole stack in-network. Not required to be up this week
  # (the app has no DB access until Phase 3); brought up from P3+ once it uses the DB.
  # Inside the compose network the app reaches services by NAME, never localhost.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jcool-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Load .env for the app's own secrets/config (JWT_ACCESS_SECRET, METRICS_TOKEN, SENTRY_DSN,
    # OTEL_ENABLED, LOG_LEVEL, …). The network-specific values below then override any
    # host-oriented ones from .env (e.g. DATABASE_URL/REDIS_URL point at localhost in .env).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network the app reaches services by NAME, not the host-mapped ports.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SEARCH_URL: http://meilisearch:7700
      SMTP_URL: smtp://mailpit:1025
      # Traces export to the Collector service (only up under `--profile observability`). Harmless
      # when OTEL_ENABLED is false or the Collector is down — OTLP export is fire-and-forget.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # Preload the OTel/Sentry instrumentation before the app (no-op unless OTEL_ENABLED=true /
    # SENTRY_DSN set). Mirrors `npm run start:prod`; the Dockerfile CMD stays plain for other runs.
    command: ['node', '--import', './dist/instrumentation.js', 'dist/main.js']
    # meilisearch is deliberately not listed: search is an optional read path the app must boot
    # and serve without.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Liveness probe (dependency-free) so `compose up --wait` confirms the app is
    # actually serving HTTP. Uses node (present in the image) — alpine has no
    # curl/wget. start_period covers boot before failures are counted.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - jcool-net

  # --- Observability stack (opt-in: `docker compose --profile observability up -d`) ---------------
  # Internal UIs bind to 127.0.0.1 only — no service is exposed on all interfaces.

  # OTel Collector: receives OTLP from the app, redacts PII, forwards to Jaeger (config in
  # infra/otel-collector/config.yaml). Distroless (no shell) → no healthcheck; started, not waited on.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: jcool-otel-collector
    profiles: [observability]
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - jcool-net

  # Jaeger v2 (all-in-one): ingests OTLP natively from the Collector; trace UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.1.0
    container_name: jcool-jaeger
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    networks:
      - jcool-net

  # Prometheus: scrapes the app's guarded /metrics (bearer token from a mounted secret file),
  # evaluates the SLO recording + burn-rate rules. depends_on app with service_started (NOT
  # healthy) — Prometheus must be up to observe the app failing, not blocked by it.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: jcool-prometheus
    profiles: [observability]
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/prometheus/secrets:/etc/prometheus/secrets:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      app:
        condition: service_started
    networks:
      - jcool-net

  # Grafana: provisioned datasources (Prometheus + Jaeger) + the 3-tier dashboard. Admin password
  # from .env; UI on 3001 (host) to avoid clashing with the app on 3000.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: jcool-grafana
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - jcool-net

volumes:
  pgdata:
  redisdata:
  meilidata:
  promdata:
  grafanadata:

networks:
  jcool-net:
    driver: bridge
