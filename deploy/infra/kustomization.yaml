apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jcool
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - id-etcd.yaml
  - temporal.yaml
  - elasticsearch.yaml
  - prometheus.yaml
  - loki.yaml
  - grafana.yaml
  - cloudflared.yaml
components:
  - ../images
configMapGenerator:
  - name: postgres-init
    files: [init-databases.sh=postgres-init.sh]
  - name: prometheus-config
    files: [prometheus.yml]
  - name: loki-config
    files: [loki-config.yaml]
patches:
  # Service links would inject REDIS_PORT=tcp://… and the like over the values the images expect.
  - target: {kind: Deployment|StatefulSet}
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
