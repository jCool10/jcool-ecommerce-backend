apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Pod discovery inside jcool only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: http, port: 9090}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: ghcr.io/jcool10/jcool-prometheus
          # The image's entrypoint is Railway's; the rules it bakes in stay at /etc/prometheus/rules.
          command: [/bin/prometheus]
          args:
            - --config.file=/etc/prometheus/k8s/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: config, mountPath: /etc/prometheus/k8s, readOnly: true}
            - {name: metrics-token, mountPath: /etc/prometheus/secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: metrics-token
          secret:
            secretName: metrics-token
            items:
              - {key: METRICS_TOKEN, path: metrics-token}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
