# Derived from the api's Postgres and rebuildable from it (RUNBOOK "Rebuild the search index").
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector: {app.kubernetes.io/name: elasticsearch}
  ports:
    - {name: http, port: 9200}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: elasticsearch}
  template:
    metadata:
      labels: {app.kubernetes.io/name: elasticsearch}
    spec:
      containers:
        - name: elasticsearch
          # Starts as root to chown the volume, then drops to uid 1000 (railway-entrypoint.sh).
          image: ghcr.io/jcool10/jcool-elasticsearch
          env:
            - {name: ES_JAVA_OPTS, value: -Xms512m -Xmx512m}
            - name: ELASTIC_PASSWORD
              valueFrom: {secretKeyRef: {name: search, key: ELASTIC_PASSWORD}}
            # Not read by the engine: there for creating jcool_api from inside the pod.
            - name: API_SEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: search, key: API_SEARCH_PASSWORD}}
          ports:
            - {name: http, containerPort: 9200}
          readinessProbe:
            exec:
              command: [sh, -c, 'curl -fs -u "elastic:$ELASTIC_PASSWORD" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"']
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
