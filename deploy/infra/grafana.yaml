# No Service: kubectl -n jcool port-forward deploy/grafana 3000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      containers:
        - name: grafana
          image: ghcr.io/jcool10/jcool-grafana
          env:
            - {name: GF_SERVER_HTTP_PORT, value: "3000"}
            - {name: GF_SERVER_ROOT_URL, value: http://localhost:3000}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana, key: GF_SECURITY_ADMIN_PASSWORD}}
            # Read by the provisioned datasources.
            - {name: PROMETHEUS_URL, value: http://prometheus:9090}
            - {name: LOKI_URL, value: http://loki:3100}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 192Mi}
