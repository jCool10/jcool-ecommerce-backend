apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki}
      annotations:
        jcool.dev/scrape-job: loki
        jcool.dev/scrape-port: "3100"
    spec:
      containers:
        - name: loki
          # Runs as root (infra/loki/Dockerfile), which local-path's hostPath directories need.
          image: ghcr.io/jcool10/jcool-loki
          args: [-config.file=/etc/loki/k8s/config.yaml]
          ports:
            - {name: http, containerPort: 3100}
          # 503 until the ingester has been in the ring for 15s.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /loki}
            - {name: config, mountPath: /etc/loki/k8s, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: loki-config
            items:
              - {key: loki-config.yaml, path: config.yaml}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
