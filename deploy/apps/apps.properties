# Non-secret values shared by the Node services. Each Deployment picks the names railway.ts gives it.
NODE_ENV=production
APP_PUBLIC_URL=https://jcool.tech
JWT_ISSUER=https://jcool.tech
JWT_AUDIENCE=jcool-api
# The pod CIDR: cloudflared and the gateway are the only proxies, and both run in it.
TRUST_PROXY=10.42.0.0/16
LOKI_URL=http://loki:3100
ID_SERVICE_URL=http://id-lb:4000
IDENTITY_PIN_BOOTSTRAP=true
LOG_LEVEL=info
THROTTLE_ENABLED=true
SWAGGER_ENABLED=true
SEARCH_ENABLED=true
STRIPE_SUCCESS_URL=https://jcool.tech/payments/success?session_id={CHECKOUT_SESSION_ID}
STRIPE_CANCEL_URL=https://jcool.tech/payments/cancel
# Stamped on every payment.authorized job; the order-service runs on its code default of the same value.
ORDER_PAID_CONSUMER_ATTEMPTS=15
