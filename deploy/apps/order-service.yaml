apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: {app.kubernetes.io/name: order-service}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: order-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: order-service}
      annotations:
        jcool.dev/scrape-job: jcool-order
        jcool.dev/scrape-port: "3000"
    spec:
      # Runs the checkout saga's Temporal worker: its shutdown takes about 24s (railway.ts), plus slack.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: order-service
          image: ghcr.io/jcool10/jcool-order-service
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: PORT, value: "3000"}
            - {name: SHUTDOWN_GRACE_PERIOD_MS, value: "5000"}
            - name: NODE_ENV
              valueFrom: {configMapKeyRef: {name: apps-env, key: NODE_ENV}}
            - name: TRUST_PROXY
              valueFrom: {configMapKeyRef: {name: apps-env, key: TRUST_PROXY}}
            - name: JWT_ISSUER
              valueFrom: {configMapKeyRef: {name: apps-env, key: JWT_ISSUER}}
            - name: JWT_AUDIENCE
              valueFrom: {configMapKeyRef: {name: apps-env, key: JWT_AUDIENCE}}
            - name: ID_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: ID_SERVICE_URL}}
            - name: LOKI_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: LOKI_URL}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: ORDER_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://order:$(DB_PASSWORD)@postgres:5432/order"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: REDIS_PASSWORD}}
            - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379"}
            - name: SMTP_URL
              valueFrom: {secretKeyRef: {name: smtp, key: SMTP_URL}}
            - name: MAIL_FROM
              valueFrom: {secretKeyRef: {name: smtp, key: MAIL_FROM}}
            - {name: AUTH_JWKS_URL, value: http://user-service:3000/.well-known/jwks.json}
            # Each *_SERVICE_TOKEN is the target's INTERNAL_CALLER_TOKEN_ORDER_SERVICE.
            - {name: USER_SERVICE_URL, value: http://user-service:3000}
            - name: USER_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_USER}}
            # The api itself, never the gateway: the gateway answers /internal with 404.
            - {name: API_SERVICE_URL, value: http://api:8080}
            - name: API_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_API}}
            - {name: INVENTORY_SERVICE_URL, value: http://inventory-service:3000}
            - name: INVENTORY_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_INVENTORY}}
            - {name: PAYMENT_SERVICE_URL, value: http://payment-service:3000}
            - name: PAYMENT_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_PAYMENT}}
            - {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
            - {name: TEMPORAL_NAMESPACE, value: jcool}
            - {name: TEMPORAL_TASK_QUEUE, value: checkout-saga}
            - name: METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: metrics-token, key: METRICS_TOKEN}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          # Includes Temporal: the pod only takes orders once its worker can poll.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
