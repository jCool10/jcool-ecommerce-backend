apiVersion: v1
kind: Service
metadata:
  name: id-service-headless
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: id-service}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: id-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: id-service}
    spec:
      # Mints for SHUTDOWN_GRACE_PERIOD_MS after SIGTERM, then releases its node.
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: id-service
          image: ghcr.io/jcool10/jcool-id-service
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: PORT, value: "3000"}
            - {name: ETCD_ENDPOINTS, value: http://id-etcd:2379}
            - {name: SHUTDOWN_GRACE_PERIOD_MS, value: "8000"}
            - name: NODE_ENV
              valueFrom: {configMapKeyRef: {name: apps-env, key: NODE_ENV}}
            - name: LOKI_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: LOKI_URL}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
