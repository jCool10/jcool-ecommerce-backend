# cloudflared's public hostname points here.
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: http, port: 8080}
---
# The id-service load balancer the Node services mint through (ID_SERVICE_URL).
apiVersion: v1
kind: Service
metadata:
  name: id-lb
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: id-lb, port: 4000, targetPort: id-lb}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway}
    spec:
      # Caddy's shutdown_delay (5s) plus grace_period (10s), plus slack.
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/jcool10/jcool-gateway
          ports:
            - {name: http, containerPort: 8080}
            - {name: id-lb, containerPort: 4000}
          envFrom:
            - configMapRef: {name: gateway-env}
          # Live, not ready, on purpose: readiness of the only gateway must not follow the api's, or
          # one api blip takes /auth and the webhook down with it.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 64Mi}
