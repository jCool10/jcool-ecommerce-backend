# Same commands as Railway's preDeployCommand, each from the image of the service that owns the database.
# Jobs are immutable, so every one is a hook that Argo CD deletes before recreating.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  labels: {app.kubernetes.io/name: api-migrate, app.kubernetes.io/component: migration}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-migrate, app.kubernetes.io/component: migration}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/jcool10/jcool-api
          command: [node, dist/shared/infrastructure/database/migrate-cli.js]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: API_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://jcool:$(DB_PASSWORD)@postgres:5432/jcool_ecommerce"}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
