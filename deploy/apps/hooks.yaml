# A no-op once the keyspace has floors. On an empty one it waits a full lease TTL (300s by default),
# then lifts the floors before any replica mints.
apiVersion: batch/v1
kind: Job
metadata:
  name: id-floors
  labels: {app.kubernetes.io/name: id-floors, app.kubernetes.io/component: migration}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/name: id-floors, app.kubernetes.io/component: migration}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: floors
          image: ghcr.io/jcool10/jcool-id-service
          command: [node, dist/lease/lift-floors-cli.js, --if-uninitialized, --settle]
          env:
            - {name: ETCD_ENDPOINTS, value: http://id-etcd:2379}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
# Tops up stock for variants that have none, after the gateway is up. Gives up quietly while the
# catalog is empty or down, as on a first sync before the catalog seed.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-seed-stock
  labels: {app.kubernetes.io/name: inventory-seed-stock, app.kubernetes.io/component: seed}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: inventory-seed-stock, app.kubernetes.io/component: seed}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: ghcr.io/jcool10/jcool-inventory-service
          command: [node, dist/database/seed-stock.js, --best-effort]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: INVENTORY_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://inventory:$(DB_PASSWORD)@postgres:5432/inventory"}
            - {name: CATALOG_PUBLIC_URL, value: http://gateway:8080}
            - name: ID_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: ID_SERVICE_URL}}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
