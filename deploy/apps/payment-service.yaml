apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector: {app.kubernetes.io/name: payment-service}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: payment-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: payment-service}
      annotations:
        jcool.dev/scrape-job: jcool-payment
        jcool.dev/scrape-port: "3000"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: payment-service
          image: ghcr.io/jcool10/jcool-payment-service
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: PORT, value: "3000"}
            - {name: SHUTDOWN_GRACE_PERIOD_MS, value: "5000"}
            - name: NODE_ENV
              valueFrom: {configMapKeyRef: {name: apps-env, key: NODE_ENV}}
            - name: TRUST_PROXY
              valueFrom: {configMapKeyRef: {name: apps-env, key: TRUST_PROXY}}
            - name: ID_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: ID_SERVICE_URL}}
            - name: LOKI_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: LOKI_URL}}
            - name: STRIPE_SUCCESS_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: STRIPE_SUCCESS_URL}}
            - name: STRIPE_CANCEL_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: STRIPE_CANCEL_URL}}
            - name: ORDER_PAID_CONSUMER_ATTEMPTS
              valueFrom: {configMapKeyRef: {name: apps-env, key: ORDER_PAID_CONSUMER_ATTEMPTS}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: PAYMENT_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://payment:$(DB_PASSWORD)@postgres:5432/payment"}
            # The default QUEUE_PREFIX: payment.authorized lands on the order-service's order-events.
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: REDIS_PASSWORD}}
            - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379"}
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: stripe, key: STRIPE_SECRET_KEY}}
            - name: PAYMENT_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: stripe, key: PAYMENT_WEBHOOK_SECRET}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_PAYMENT}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE_PREVIOUS
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_PAYMENT_PREVIOUS, optional: true}}
            - name: METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: metrics-token, key: METRICS_TOKEN}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
