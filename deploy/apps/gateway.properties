PORT=8080
API_UPSTREAM=api:8080
AUTH_UPSTREAM=user-service:3000
AUTH_UPSTREAM_REQUIRED=true
INVENTORY_UPSTREAM=inventory-service:3000
PAYMENT_UPSTREAM=payment-service:3000
ORDER_UPSTREAM=order-service:3000
# dynamic a needs one A record per replica, which only a headless Service gives.
ID_SERVICE_HOST=id-service-headless
ID_SERVICE_PORT=3000
ID_LB_PORT=4000
ID_LB_IP_VERSIONS=ipv4
# cloudflared dials from the pod CIDR and names the client in Cf-Connecting-Ip.
TRUSTED_PROXY_CIDRS=10.42.0.0/16
GATEWAY_CLIENT_IP_HEADERS=Cf-Connecting-Ip
AUTH_WRITE_FREEZE=false
CHECKOUT_WRITE_FREEZE=false
