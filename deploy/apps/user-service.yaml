apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector: {app.kubernetes.io/name: user-service}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: user-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: user-service}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: user-service
          image: ghcr.io/jcool10/jcool-user-service
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: PORT, value: "3000"}
            - {name: SHUTDOWN_GRACE_PERIOD_MS, value: "5000"}
            - name: NODE_ENV
              valueFrom: {configMapKeyRef: {name: apps-env, key: NODE_ENV}}
            - name: APP_PUBLIC_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: APP_PUBLIC_URL}}
            - name: IDENTITY_PIN_BOOTSTRAP
              valueFrom: {configMapKeyRef: {name: apps-env, key: IDENTITY_PIN_BOOTSTRAP}}
            - name: JWT_ISSUER
              valueFrom: {configMapKeyRef: {name: apps-env, key: JWT_ISSUER}}
            - name: JWT_AUDIENCE
              valueFrom: {configMapKeyRef: {name: apps-env, key: JWT_AUDIENCE}}
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: apps-env, key: LOG_LEVEL}}
            - name: THROTTLE_ENABLED
              valueFrom: {configMapKeyRef: {name: apps-env, key: THROTTLE_ENABLED}}
            - name: TRUST_PROXY
              valueFrom: {configMapKeyRef: {name: apps-env, key: TRUST_PROXY}}
            - name: ID_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: ID_SERVICE_URL}}
            - name: LOKI_URL
              valueFrom: {configMapKeyRef: {name: apps-env, key: LOKI_URL}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: USERS_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://users:$(DB_PASSWORD)@postgres:5432/users"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: REDIS_PASSWORD}}
            - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379"}
            - name: SMTP_URL
              valueFrom: {secretKeyRef: {name: smtp, key: SMTP_URL}}
            - name: MAIL_FROM
              valueFrom: {secretKeyRef: {name: smtp, key: MAIL_FROM}}
            - name: JWT_ES256_ACTIVE_KID
              valueFrom: {secretKeyRef: {name: user-service-keys, key: JWT_ES256_ACTIVE_KID}}
            - name: JWT_ES256_PRIVATE_KEYS
              valueFrom: {secretKeyRef: {name: user-service-keys, key: JWT_ES256_PRIVATE_KEYS}}
            - name: CSRF_SECRET
              valueFrom: {secretKeyRef: {name: user-service-keys, key: CSRF_SECRET}}
            # One caller token per caller; each _PREVIOUS is accepted too while a rotation is under way.
            - name: INTERNAL_API_TOKEN
              valueFrom: {secretKeyRef: {name: internal-tokens, key: API_TO_USER}}
            - name: INTERNAL_API_TOKEN_PREVIOUS
              valueFrom: {secretKeyRef: {name: internal-tokens, key: API_TO_USER_PREVIOUS, optional: true}}
            - name: INTERNAL_CALLER_TOKEN_INVENTORY_SERVICE
              valueFrom: {secretKeyRef: {name: internal-tokens, key: INVENTORY_TO_USER}}
            - name: INTERNAL_CALLER_TOKEN_INVENTORY_SERVICE_PREVIOUS
              valueFrom: {secretKeyRef: {name: internal-tokens, key: INVENTORY_TO_USER_PREVIOUS, optional: true}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_USER}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE_PREVIOUS
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_USER_PREVIOUS, optional: true}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          # argon2 hashes in memory, one buffer per concurrent login.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
