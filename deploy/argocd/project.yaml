apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jcool
  namespace: argocd
spec:
  description: jcool production
  sourceRepos:
    - https://github.com/jCool10/jcool-ecommerce-backend.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: jcool}
  # The jcool Namespace is the only cluster-scoped object either Application owns.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
