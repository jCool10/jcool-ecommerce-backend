# Argo CD itself, applied by deploy/scripts/bootstrap-cluster.sh; it does not manage itself.
# project.yaml and applications.yaml stay out of this build: their CRDs must exist before they apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml
patches:
  # No SSO, notifications or ApplicationSets: the UI is reached by port-forward with the admin login.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-notifications-controller-metrics
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests: {memory: 512Mi}
                  limits: {memory: 512Mi}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {memory: 256Mi}
                  limits: {memory: 256Mi}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests: {memory: 128Mi}
                  limits: {memory: 128Mi}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: {memory: 64Mi}
                  limits: {memory: 64Mi}
