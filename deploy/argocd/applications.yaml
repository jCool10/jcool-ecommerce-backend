# No resources finalizer: deleting an Application leaves its workloads and volumes in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jcool-infra
  namespace: argocd
  labels: {jcool.dev/application: infra}
spec:
  project: jcool
  source:
    repoURL: https://github.com/jCool10/jcool-ecommerce-backend.git
    targetRevision: main
    path: deploy/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: jcool
  syncPolicy:
    # Never prune: a StatefulSet dropped from git by mistake must not take its data with it.
    automated: {prune: false, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jcool-apps
  namespace: argocd
  labels: {jcool.dev/application: apps}
spec:
  project: jcool
  source:
    repoURL: https://github.com/jCool10/jcool-ecommerce-backend.git
    targetRevision: main
    path: deploy/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: jcool
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
