apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki}
      annotations:
        jcool.dev/scrape-job: loki
        jcool.dev/scrape-port: "3100"
    spec:
      enableServiceLinks: false
      containers:
        - name: loki
          # Runs as root (infra/loki/Dockerfile), which local-path's hostPath directories need.
          image: ghcr.io/jcool10/jcool-loki
          args: [-config.file=/etc/loki/k8s/config.yaml]
          ports:
            - {name: http, containerPort: 3100}
          # 503 until the ingester has been in the ring for 15s.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /loki}
            - {name: config, mountPath: /etc/loki/k8s, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: loki-config
            items:
              - {key: loki-config.yaml, path: config.yaml}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
# No Service and no Ingress: kubectl -n jcool port-forward deploy/grafana 3000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          image: ghcr.io/jcool10/jcool-grafana
          env:
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana, key: GF_SECURITY_ADMIN_PASSWORD}}
            # Read by the provisioned datasources.
            - {name: PROMETHEUS_URL, value: http://prometheus:9090}
            - {name: LOKI_URL, value: http://loki:3100}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 192Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, api-worker, id-service, user-service, inventory-service, payment-service, order-service, grafana, prometheus]
      ports:
        - port: 3100
