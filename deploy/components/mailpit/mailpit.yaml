# Accepts every message and delivers none; read a verification link in its UI on 8025
# (kubectl -n jcool port-forward svc/mailpit 8025).
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: {app.kubernetes.io/name: mailpit}
  ports:
    - {name: smtp, port: 1025}
    - {name: http, port: 8025}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mailpit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailpit}
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            exec: {command: [/mailpit, readyz]}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mailpit}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [user-service, order-service]}
      ports:
        - port: 1025
