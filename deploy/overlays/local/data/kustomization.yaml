apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jcool
resources:
  - ../../../base/data
  # Written by deploy/scripts/seal-secrets.sh local seal.
  - secrets
components:
  - ../../../components/minio
  - ../../../components/mailpit
  # Last: components only see what the ones above them added, so this one pins theirs too.
  - ../../../images
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: temporal
      spec:
        template:
          spec:
            containers:
              - name: temporal
                env:
                  - {name: TEMPORAL_NAMESPACE_RETENTION, value: 1d}
