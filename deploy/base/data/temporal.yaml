apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  selector: {app.kubernetes.io/name: temporal}
  ports:
    - {name: grpc, port: 7233}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 1
  # Never two servers on one history store, not even for the length of a rollout.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: temporal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal}
    spec:
      containers:
        - name: temporal
          image: ghcr.io/jcool10/jcool-temporal
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_SEEDS, value: postgres}
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PWD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: TEMPORAL_DB_PASSWORD}}
            - {name: BIND_ON_IP, value: 0.0.0.0}
            # Fixed for the life of the database.
            - {name: NUM_HISTORY_SHARDS, value: "4"}
            - {name: TEMPORAL_NAMESPACE, value: jcool}
            - {name: TEMPORAL_NAMESPACE_RETENTION, value: 7d}
          ports:
            - {name: grpc, containerPort: 7233}
          # The entrypoint creates the search attributes last; a first boot on an empty database
          # takes minutes, which the startup probe allows before liveness takes over.
          startupProbe:
            exec:
              command: [sh, -c, temporal --address 127.0.0.1:7233 operator search-attribute list --namespace jcool | grep -q CheckoutDeadlineAt]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {memory: 768Mi}
