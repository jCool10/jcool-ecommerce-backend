# The id-service's node leases. Upstream image with the env of infra/etcd/Dockerfile, which compose
# and Railway still build: change one, change the other.
apiVersion: v1
kind: Service
metadata:
  name: id-etcd
spec:
  selector: {app.kubernetes.io/name: id-etcd}
  ports:
    - {name: client, port: 2379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: id-etcd
spec:
  serviceName: id-etcd
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: id-etcd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: id-etcd}
    spec:
      containers:
        - name: etcd
          image: gcr.io/etcd-development/etcd:v3.6.5@sha256:042ef9c02799eb9303abf1aa99b09f09d94b8ee3ba0c2dd3f42dc4e1d3dce534
          command: [/usr/local/bin/etcd]
          env:
            - {name: ETCD_NAME, value: id-etcd}
            - {name: ETCD_DATA_DIR, value: /var/lib/etcd/data}
            - {name: ETCD_LISTEN_CLIENT_URLS, value: "http://[::]:2379"}
            - {name: ETCD_ADVERTISE_CLIENT_URLS, value: "http://id-etcd:2379"}
            - {name: ETCD_AUTO_COMPACTION_MODE, value: periodic}
            - {name: ETCD_AUTO_COMPACTION_RETENTION, value: 1h}
          ports:
            - {name: client, containerPort: 2379}
          readinessProbe:
            exec: {command: [etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/etcd}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
