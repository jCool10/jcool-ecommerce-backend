apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml]
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
patches:
  # Service links would inject PROMETHEUS_PORT=tcp://… and the like over the values the images expect.
  - target: {kind: Deployment|StatefulSet|Job}
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
