# One Job per database, each from the image of the service that owns it, so a digest change moves
# both. Jobs are immutable: deploy/scripts/local-cluster.sh deletes the old ones before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  labels: {app.kubernetes.io/name: api-migrate, app.kubernetes.io/component: migration}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-migrate, app.kubernetes.io/component: migration}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/jcool10/jcool-api
          command: [node, dist/shared/infrastructure/database/migrate-cli.js]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: API_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://jcool:$(DB_PASSWORD)@postgres:5432/jcool_ecommerce"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
