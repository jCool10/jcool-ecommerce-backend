# Migrates, then tops up stock for variants that have none; the top-up gives up quietly while the
# catalog is down, as it is on a first apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-migrate
  labels: {app.kubernetes.io/name: inventory-migrate, app.kubernetes.io/component: migration}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app.kubernetes.io/name: inventory-migrate, app.kubernetes.io/component: migration}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/jcool10/jcool-inventory-service
          command: [node, dist/database/pre-deploy-cli.js]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: INVENTORY_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://inventory:$(DB_PASSWORD)@postgres:5432/inventory"}
            - {name: CATALOG_PUBLIC_URL, value: http://gateway:8080}
            - {name: ID_SERVICE_URL, value: http://gateway:4000}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
