# A no-op once the keyspace has floors; on an empty one it lifts them before any replica mints.
apiVersion: batch/v1
kind: Job
metadata:
  name: id-floors
  labels: {app.kubernetes.io/name: id-floors, app.kubernetes.io/component: migration}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app.kubernetes.io/name: id-floors, app.kubernetes.io/component: migration}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: floors
          image: ghcr.io/jcool10/jcool-id-service
          command: [node, dist/lease/lift-floors-cli.js, --if-uninitialized]
          env:
            - {name: ETCD_ENDPOINTS, value: http://id-etcd:2379}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
