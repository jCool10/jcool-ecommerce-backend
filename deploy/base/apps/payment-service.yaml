apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector: {app.kubernetes.io/name: payment-service}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: payment-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: payment-service}
      annotations:
        jcool.dev/scrape-job: jcool-payment
        jcool.dev/scrape-port: "3000"
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: payment-service
          image: ghcr.io/jcool10/jcool-payment-service
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - configMapRef: {name: apps-env}
            - secretRef: {name: stripe}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: TRUST_PROXY, value: 10.42.0.0/16}
            - {name: SHUTDOWN_GRACE_PERIOD_MS, value: "5000"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: PAYMENT_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://payment:$(DB_PASSWORD)@postgres:5432/payment"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: REDIS_PASSWORD}}
            - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379"}
            - {name: ID_SERVICE_URL, value: http://gateway:4000}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_PAYMENT}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE_PREVIOUS
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_PAYMENT_PREVIOUS, optional: true}}
            - name: METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: metrics-token, key: METRICS_TOKEN}}
            # Stamped on every payment.authorized job; the order-service's code default. Change both together.
            - {name: ORDER_PAID_CONSUMER_ATTEMPTS, value: "15"}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
