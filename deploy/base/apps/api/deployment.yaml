apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api}
      annotations:
        jcool.dev/scrape-job: jcool-api
        jcool.dev/scrape-port: "3000"
    spec:
      # Railway's drainingSeconds (30) plus slack; RUNBOOK "The shutdown budget".
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/jcool10/jcool-api
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - configMapRef: {name: apps-env}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: TRUST_PROXY, value: 10.42.0.0/16}
            - {name: SHUTDOWN_GRACE_PERIOD_MS, value: "5000"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: API_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://jcool:$(DB_PASSWORD)@postgres:5432/jcool_ecommerce"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis, key: REDIS_PASSWORD}}
            - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379"}
            - {name: AUTH_JWKS_URL, value: http://user-service:3000/.well-known/jwks.json}
            - {name: USER_SERVICE_INTERNAL_URL, value: http://user-service:3000}
            - {name: ID_SERVICE_URL, value: http://gateway:4000}
            - name: INTERNAL_API_TOKEN
              valueFrom: {secretKeyRef: {name: internal-tokens, key: API_TO_USER}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_API}}
            - name: INTERNAL_CALLER_TOKEN_ORDER_SERVICE_PREVIOUS
              valueFrom: {secretKeyRef: {name: internal-tokens, key: ORDER_TO_API_PREVIOUS, optional: true}}
            - name: METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: metrics-token, key: METRICS_TOKEN}}
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: object-storage, key: STORAGE_ACCESS_KEY_ID}}
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: object-storage, key: STORAGE_SECRET_ACCESS_KEY}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
