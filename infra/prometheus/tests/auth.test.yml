# Rule unit tests for auth.yml. Run: promtool test rules infra/prometheus/tests/*.test.yml
#
# The two ends of the one rule: it must survive a burst without firing, and it must fire when the
# misses keep coming. The first is the case that matters — a Redis failover produces a large,
# harmless spike, and an alert that pages on it would be turned off before it ever caught a real
# regression.
rule_files:
  - ../rules/auth.yml

evaluation_interval: 15s

tests:
  # A lost keyspace: every outstanding token misses once, then refresh republishes and it stops.
  # 200 misses inside a minute is far over the threshold, and must still not fire — the spike leaves
  # the 10m rate window before the 15m hold elapses.
  - interval: 1m
    input_series:
      - series: 'auth_epoch_projection_miss_total{job="jcool-user", instance="user:3001"}'
        values: '0+0x5 200+0x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: AuthEpochProjectionMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: AuthEpochProjectionMissing
        exp_alerts: []

  # A mint path that stopped publishing: misses arrive at a steady 0.5/s and never stop.
  - interval: 1m
    input_series:
      - series: 'auth_epoch_projection_miss_total{job="jcool-user", instance="user:3001"}'
        values: '0+30x40'
    alert_rule_test:
      # Over threshold, inside the hold — firing here would defeat the burst test above.
      - eval_time: 10m
        alertname: AuthEpochProjectionMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: AuthEpochProjectionMissing
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: 'Session epochs are missing from Redis at a sustained rate'
              description: 'Tokens are being rejected because `auth:epoch:{sub}` is absent, at 0.50/s and not settling. Postgres still holds the truth, so nothing is lost — but each affected user is 401ing until their client refreshes. A rate that persists means a mint or bump path is no longer publishing; check the projection writer and the Redis keyspace before assuming the clients are at fault.'
