# Rule unit tests for messaging.yml. Run: promtool test rules infra/prometheus/tests/*.test.yml
#
# Series carry the `job`/`instance` a real scrape attaches, so the `and on()` join against `up` is
# exercised the way production evaluates it.
rule_files:
  - ../rules/messaging.yml

evaluation_interval: 15s

tests:
  # The consumer stops: the oldest waiting job ages past a minute and keeps ageing, then the
  # consumer drains the queue.
  - interval: 1m
    input_series:
      - series: 'messaging_queue_oldest_waiting_seconds{job="jcool-api", instance="app:3000", queue="domain-events"}'
        values: '0x4 30+60x20 0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: MessagingQueueConsumerLagging
        exp_alerts: []
      - eval_time: 12m
        alertname: MessagingQueueConsumerLagging
        exp_alerts:
          - exp_labels:
              queue: domain-events
              severity: page
            exp_annotations:
              summary: 'Queue domain-events is not being consumed'
              description: 'The oldest waiting job on domain-events is 7m 30s old and has been over a minute for 5 minutes. On domain-events that holds back payment.authorized on its way to the saga, so paid checkouts run into their deadline and compensate. RUNBOOK → The checkout saga → MessagingQueueConsumerLagging.'
      - eval_time: 28m
        alertname: MessagingQueueConsumerLagging
        exp_alerts: []

  # The wiring regression: the api is still scraped but the queue gauge went absent.
  - interval: 1m
    input_series:
      - series: 'up{job="jcool-api", instance="app:3000"}'
        values: '1x40'
      - series: 'messaging_queue_oldest_waiting_seconds{job="jcool-api", instance="app:3000", queue="domain-events"}'
        values: '0x10 _x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MessagingQueueMetricsAbsent
        exp_alerts: []
      - eval_time: 26m
        alertname: MessagingQueueMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: 'Queue depth metrics are missing from the api'
              description: 'The api is being scraped but reports no messaging_queue_oldest_waiting_seconds, so MessagingQueueConsumerLagging cannot fire: the queue depth collector is not registered in the app that owns the metrics registry. RUNBOOK → The checkout saga → Saga metrics absent.'

  # The api is down: `up` reads 0 and the gauge is gone with it. ApiScrapeDown owns that.
  - interval: 1m
    input_series:
      - series: 'up{job="jcool-api", instance="app:3000"}'
        values: '1x10 0x40'
      - series: 'messaging_queue_oldest_waiting_seconds{job="jcool-api", instance="app:3000", queue="domain-events"}'
        values: '0x10 _x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MessagingQueueMetricsAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: MessagingQueueMetricsAbsent
        exp_alerts: []

  # An empty queue reports 0, which is present, not absent.
  - interval: 1m
    input_series:
      - series: 'up{job="jcool-api", instance="app:3000"}'
        values: '1x40'
      - series: 'messaging_queue_oldest_waiting_seconds{job="jcool-api", instance="app:3000", queue="domain-events"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MessagingQueueMetricsAbsent
        exp_alerts: []
