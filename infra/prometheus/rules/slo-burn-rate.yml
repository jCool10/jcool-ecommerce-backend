# SLO recording rules + multi-window burn-rate alerts (Google SRE workbook model).
# Two SLIs: availability (non-5xx ratio) and latency (p99). SLO targets are QUALITATIVE
# placeholders — re-derived from real k6 numbers in Phase 6 (DoD-19). Availability SLO 99.9%
# ⇒ error budget 0.1%. A burn rate of 14.4 exhausts a 30-day budget in ~2 days (fast burn).
#
# KNOWN LIMITATION (RED source = an APP_INTERCEPTOR). Nest runs guards BEFORE interceptors, so
# requests rejected by a global guard (JwtAuthGuard 401, RolesGuard 403, throttler 429) or that
# 5xx from *inside* a guard (e.g. the jwt denylist Redis lookup failing) are NOT counted in
# http_requests_total — the availability numerator misses that class of outage. Acceptable for
# the local, qualitative Phase 2 SLO; revisit in Phase 5 (alert wiring + health hardening): move
# RED to a res.on('finish') hook or add a guard-origin counter in HttpExceptionFilter if the SLO
# must cover all ingress. Note too: the recording rules below aggregate globally (single scrape
# job); add `by (job)` if a second job is ever scraped.
groups:
  - name: http-slo-recordings
    interval: 15s
    rules:
      # Error = 5xx. Ratio of 5xx to all requests over several windows (job-wide).
      - record: job:http_request_error_rate:ratio5m
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          / sum(rate(http_requests_total[5m]))
      - record: job:http_request_error_rate:ratio30m
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[30m]))
          / sum(rate(http_requests_total[30m]))
      - record: job:http_request_error_rate:ratio1h
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[1h]))
          / sum(rate(http_requests_total[1h]))
      - record: job:http_request_error_rate:ratio6h
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[6h]))
          / sum(rate(http_requests_total[6h]))
      # p99 latency per route. histogram_quantile over the summed bucket rate BY le — the
      # only correct way (averaging a pre-computed quantile is wrong: quantiles don't average).
      - record: route:http_request_duration_seconds:p99
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
          )

  - name: http-slo-burn-rate-alerts
    rules:
      # Fast burn: 1h AND 5m windows both hot ⇒ page. 14.4 = burn that drains a 99.9%
      # monthly budget in ~2 days. The short window makes the alert self-resolve on recovery.
      - alert: HighErrorBudgetBurnFast
        expr: |
          job:http_request_error_rate:ratio1h > (14.4 * 0.001)
          and job:http_request_error_rate:ratio5m > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: 'Fast error-budget burn (availability SLO 99.9%)'
          description: '5xx burn rate >14.4x over 1h and 5m — ~2 days to exhaust the 30-day budget.'
      # Slow burn: 6h AND 30m windows. 6 = drains the budget in ~10 days. Ticket, not page.
      - alert: HighErrorBudgetBurnSlow
        expr: |
          job:http_request_error_rate:ratio6h > (6 * 0.001)
          and job:http_request_error_rate:ratio30m > (6 * 0.001)
        for: 15m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: 'Slow error-budget burn (availability SLO 99.9%)'
          description: '5xx burn rate >6x over 6h and 30m — ~10 days to exhaust the 30-day budget.'

  # SEAM (BF#4 outbox) — disabled until the outbox table + poller exist. Uncomment when
  # outbox_backlog_pending / outbox_oldest_age_seconds report real values (they are 0 now).
