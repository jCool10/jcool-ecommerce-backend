# Railway scrape config. Same shape as prometheus.yml, but the targets are placeholders: private
# domains are only known at runtime, so railway-entrypoint.sh substitutes them.
#
# The SLO recording rules in rules/ select job="jcool-api", so the inventory-service's HTTP series stay
# out of the api's SLI. Any other rule aggregating without a job selector must not read a series two
# jobs export.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: jcool-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['__API_TARGET__']

  # The api's token: Railway references the api's METRICS_TOKEN on both services.
  - job_name: jcool-inventory
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['__INVENTORY_TARGET__']

  # Only the loki_* series rules/loki.yml reads, which the api never exports.
  - job_name: loki
    static_configs:
      - targets: ['__LOKI_TARGET__']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: loki_(request_duration_seconds_count|discarded_samples_total|ingester_chunks_flush_failures_total)
        action: keep
