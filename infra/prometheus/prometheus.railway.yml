# Railway scrape config. Same shape as prometheus.yml, but the target is a placeholder: the
# api's private domain is only known at runtime, so railway-entrypoint.sh substitutes it.
#
# One job only. The recording rules in rules/ aggregate globally without `by (job)`, so a second
# scrape job would silently mix two services into one SLI.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: jcool-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['__API_TARGET__']
