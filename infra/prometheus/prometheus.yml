# Prometheus scrape config for the local observability stack. Scrapes the API's guarded /metrics
# with a bearer token read from a file, never inlined. SLO recording + burn-rate rules live in
# rules/; their targets are derived from the k6 baseline recorded there.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # One job per deployable. The identity and auth-epoch series come from jcool-user alone — it is the
  # only issuer and the only process that mints ids — so a rule that goes quiet there is not covered
  # by jcool-api still reporting.
  - job_name: jcool-api
    metrics_path: /metrics
    # The token must match or /metrics answers 404 — an unauthenticated scraper cannot even
    # confirm the endpoint exists. File-based so the secret is mounted, never committed.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['commerce-core:3000']

  # DNS discovery, not a static target: the service scales, and compose resolves `user` to every
  # replica's address. A static target would round-robin to one of them per scrape, so two replicas
  # holding distinct leased node ids would look like one flapping between them.
  - job_name: jcool-user
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    dns_sd_configs:
      - names: ['user']
        type: A
        port: 3001
        refresh_interval: 15s
