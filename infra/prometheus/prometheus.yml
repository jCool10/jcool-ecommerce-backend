# Prometheus scrape config for the local observability stack. Scrapes the API's guarded /metrics
# with a bearer token read from a file, never inlined. SLO recording + burn-rate rules live in
# rules/; their targets are derived from the k6 baseline recorded there.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: jcool-api
    metrics_path: /metrics
    # The token must match or /metrics answers 404 — an unauthenticated scraper cannot even
    # confirm the endpoint exists. File-based so the secret is mounted, never committed.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['app:3000']
