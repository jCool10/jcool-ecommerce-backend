# Prometheus scrape config for the local observability stack (wired into docker-compose in
# Phase 5). Scrapes the API's guarded /metrics with a bearer token read from a file (never
# inlined). SLO recording + burn-rate rules live in rules/. Numbers here (SLO targets) are
# qualitative until k6 in Phase 6 (DoD-19).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: jcool-api
    metrics_path: /metrics
    # Token match or the endpoint answers 404 (ADR-0018). File-based so the secret is
    # mounted, not committed. Provision it in Phase 5's compose (e.g. a Docker secret).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ['app:3000']
