# Overrides the compose datasources (prometheus:9090, jaeger:16686) inside the Railway image.
# Prometheus and Loki are reached over Railway's private network; no Jaeger runs there, and no
# provisioned dashboard references it.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus.railway.internal:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki.railway.internal:3100
    jsonData:
      maxLines: 1000
      # With no trace backend on Railway, a traceId links to every service's lines for that trace.
      # `$$` because provisioning expands `$` as an environment variable.
      derivedFields:
        - name: traceId
          matcherType: regex
          matcherRegex: '"traceId":"(\w+)"'
          datasourceUid: loki
          url: '{service=~".+"} |= "$${__value.raw}"'
          urlDisplayLabel: Logs for this trace
